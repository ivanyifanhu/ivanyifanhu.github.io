name: Build and publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Apply verified website updates
        run: |
          python3 - <<'PY48'
          from pathlib import Path
          import zipfile,hashlib,json,base64,runpy
          root=Path.cwd().resolve()
          restored=base64.b64decode(b''.join((root/'v56-update.b64').read_bytes().split()),validate=True)
          assert hashlib.sha256(restored).hexdigest()=='a927720ab35b4bfb2821e1753f066bae81e6f858c048cd3bc496b1a76354ff30'
          (root/'v56-update.zip').write_bytes(restored)
          restored57=base64.b64decode(b''.join((root/'v57-update.b64').read_bytes().split()),validate=True)
          assert hashlib.sha256(restored57).hexdigest()=='c290097531659526bbfc4bdd62f015b8b5c89b88edbd96385d899e7ec7fd10c6'
          (root/'v57-update.zip').write_bytes(restored57)
          restored58=base64.b64decode(b''.join((root/'v58-update.b64').read_bytes().split()),validate=True)
          assert hashlib.sha256(restored58).hexdigest()=='c104e22a55025155e41d9d47da4b72d45959e888f4110544f76fb9bd8420086e'
          (root/'v58-update.zip').write_bytes(restored58)
          restored58=base64.b64decode(b''.join((root/'v59-update.b64').read_bytes().split()),validate=True)
          assert hashlib.sha256(restored58).hexdigest()=='971f658e4d3439cc100087ba820991bf4acf3fb6fd94f9ca904333326494dbe0'
          (root/'v59-update.zip').write_bytes(restored58)
          restored60=base64.b64decode(b''.join((root/'v60-update.b64').read_bytes().split()),validate=True)
          assert hashlib.sha256(restored60).hexdigest()=='0527ce81b01b86a49e4cdaa13a3392ed918dc221397c8932e51dbfaa4806e8b6'
          (root/'v60-update.zip').write_bytes(restored60)
          restored60=base64.b64decode(b''.join((root/'v61-update.b64').read_bytes().split()),validate=True)
          assert hashlib.sha256(restored60).hexdigest()=='3cb6561855c38d9dff61a57f056ecf7df03896a8206ae7bf42efe8b06ea4ff7e'
          (root/'v61-update.zip').write_bytes(restored60)
          restored60=base64.b64decode(b''.join((root/'v62-update.b64').read_bytes().split()),validate=True)
          assert hashlib.sha256(restored60).hexdigest()=='d2a0cfb4658d923ed61c3bed94afb402ba49a9eb969d1b3524aef004d449bcca'
          (root/'v62-update.zip').write_bytes(restored60)
          updates=[('v44-update.zip','a8d398c424c3a9bc2f240bcaf617a701c5c52d2373635a8122836176f0eaf276','_build/v44-update-manifest.json'),('v48-update.zip','40e33434d3c886fd01bc1dce551a04dff4e372dceda078ea9b703896c39a5beb','_build/v48-update-manifest.json'),('v49-update.zip','d014742044ae92e4a5cb8c35b509fadb1c2c860043c5a4198b3f840ec65e1bdd','_build/v49-update-manifest.json'),('v50-update.zip','c6ac256c6919e7a91bea38c9f179d93a6b2a2868e12777e42a49023441da9314','_build/v50-update-manifest.json'),('v51-update.zip','d04d01543cf7caf02cb96af7cd74ba7e7c1a94064116b104e082775da236895c','_build/v51-update-manifest.json'),('v52-update.zip','e4caace2c3d8853e0349e7cc7e24af867d6e52112dfc75059a3f22c6cea698b2','_build/v52-update-manifest.json'),('v53-update.zip','6d3157295c7c1390a0f374b0b58af07dffba1a177deffbea8e7ac78bc9e2ae23','_build/v53-update-manifest.json'),('v54-update.zip','bba3524f5cd714ad4c3933b4c3af5eea3b8e59e682bef8a2e07c037d1ca5db12','_build/v54-update-manifest.json'),('v55-update.zip','1dfe68e7abf323296fcca16e099d9740685501fdee4fffe73da4a708ef820c2b','_build/v55-update-manifest.json'),('v56-update.zip','a927720ab35b4bfb2821e1753f066bae81e6f858c048cd3bc496b1a76354ff30','_build/v56-update-manifest.json'),('v57-update.zip','c290097531659526bbfc4bdd62f015b8b5c89b88edbd96385d899e7ec7fd10c6','_build/v57-update-manifest.json'),('v58-update.zip','c104e22a55025155e41d9d47da4b72d45959e888f4110544f76fb9bd8420086e','_build/v58-update-manifest.json'),('v59-update.zip','971f658e4d3439cc100087ba820991bf4acf3fb6fd94f9ca904333326494dbe0','_build/v59-update-manifest.json'),('v60-update.zip','0527ce81b01b86a49e4cdaa13a3392ed918dc221397c8932e51dbfaa4806e8b6','_build/v60-update-manifest.json'),('v61-update.zip','3cb6561855c38d9dff61a57f056ecf7df03896a8206ae7bf42efe8b06ea4ff7e','_build/v61-update-manifest.json'),('v62-update.zip','d2a0cfb4658d923ed61c3bed94afb402ba49a9eb969d1b3524aef004d449bcca','_build/v62-update-manifest.json')]
          for filename,digest,manifest in updates:
              archive=root/filename
              assert hashlib.sha256(archive.read_bytes()).hexdigest()==digest
              with zipfile.ZipFile(archive) as bundle:
                  expected=json.loads(bundle.read(manifest))
                  assert set(bundle.namelist())==set(expected)|{manifest}
                  for name in bundle.namelist():
                      target=(root/name).resolve()
                      assert target.is_relative_to(root) and not Path(name).is_absolute()
                      data=bundle.read(name)
                      if name in expected: assert hashlib.sha256(data).hexdigest()==expected[name]
                      target.parent.mkdir(parents=True,exist_ok=True)
                      target.write_bytes(data)
              fixes={'v56-update.zip':'_build/apply-v56-index.py','v57-update.zip':'_build/apply-v57-text.py','v58-update.zip':'_build/apply-v58-text.py','v59-update.zip':'_build/apply-v59-text.py'}
              if filename in fixes:runpy.run_path(str(root/fixes[filename]),run_name='__main__')
          PY48
      - uses: actions/configure-pages@v5
      - name: Build public website
        run: python3 _build/build.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
