name: Build and publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Apply verified website updates
        run: |
          python3 - <<'PY48'
          from pathlib import Path
          import zipfile,hashlib,json
          root=Path.cwd().resolve()
          updates=[('v44-update.zip','a8d398c424c3a9bc2f240bcaf617a701c5c52d2373635a8122836176f0eaf276','_build/v44-update-manifest.json'),('v48-update.zip','40e33434d3c886fd01bc1dce551a04dff4e372dceda078ea9b703896c39a5beb','_build/v48-update-manifest.json'),('v49-update.zip','d014742044ae92e4a5cb8c35b509fadb1c2c860043c5a4198b3f840ec65e1bdd','_build/v49-update-manifest.json'),('v50-update.zip','c6ac256c6919e7a91bea38c9f179d93a6b2a2868e12777e42a49023441da9314','_build/v50-update-manifest.json'),('v51-update.zip','d04d01543cf7caf02cb96af7cd74ba7e7c1a94064116b104e082775da236895c','_build/v51-update-manifest.json'),('v52-update.zip','e4caace2c3d8853e0349e7cc7e24af867d6e52112dfc75059a3f22c6cea698b2','_build/v52-update-manifest.json'),('v53-update.zip','6d3157295c7c1390a0f374b0b58af07dffba1a177deffbea8e7ac78bc9e2ae23','_build/v53-update-manifest.json'),('v54-update.zip','bba3524f5cd714ad4c3933b4c3af5eea3b8e59e682bef8a2e07c037d1ca5db12','_build/v54-update-manifest.json'),('v55-update.zip','1dfe68e7abf323296fcca16e099d9740685501fdee4fffe73da4a708ef820c2b','_build/v55-update-manifest.json')]
          for filename,digest,manifest in updates:
              archive=root/filename
              assert hashlib.sha256(archive.read_bytes()).hexdigest()==digest
              with zipfile.ZipFile(archive) as bundle:
                  expected=json.loads(bundle.read(manifest))
                  assert set(bundle.namelist())==set(expected)|{manifest}
                  for name in bundle.namelist():
                      target=(root/name).resolve()
                      assert target.is_relative_to(root) and not Path(name).is_absolute()
                      data=bundle.read(name)
                      if name in expected: assert hashlib.sha256(data).hexdigest()==expected[name]
                      target.parent.mkdir(parents=True,exist_ok=True)
                      target.write_bytes(data)
          PY48
      - uses: actions/configure-pages@v5
      - name: Build public website
        run: python3 _build/build.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
