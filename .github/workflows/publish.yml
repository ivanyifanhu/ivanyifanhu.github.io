name: Build and publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Apply verified website updates
        run: |
          python3 - <<'PY46'
          from pathlib import Path
          import zipfile,hashlib,json
          root=Path.cwd().resolve()
          updates=[('v44-update.zip','a8d398c424c3a9bc2f240bcaf617a701c5c52d2373635a8122836176f0eaf276','_build/v44-update-manifest.json'),('v46-update.zip','c55c9b7dbe06553cc843d1ab05f3ecb2365138818b15bb7195e7bad35063ddf1','_build/v46-update-manifest.json')]
          for filename,digest,manifest in updates:
              archive=root/filename
              assert hashlib.sha256(archive.read_bytes()).hexdigest()==digest
              with zipfile.ZipFile(archive) as bundle:
                  expected=json.loads(bundle.read(manifest))
                  assert set(bundle.namelist())==set(expected)|{manifest}
                  for name in bundle.namelist():
                      target=(root/name).resolve()
                      assert target.is_relative_to(root) and not Path(name).is_absolute()
                      data=bundle.read(name)
                      if name in expected: assert hashlib.sha256(data).hexdigest()==expected[name]
                      target.parent.mkdir(parents=True,exist_ok=True)
                      target.write_bytes(data)
          PY46
      - uses: actions/configure-pages@v5
      - name: Build public website
        run: python3 _build/build.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
